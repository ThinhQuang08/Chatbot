stories:
- story: greet then search destination
  steps:
  - user: |
      chào bot
    intent: greet
  - action: utter_greet
  - user: |
      gợi ý điểm du lịch miền Trung
    intent: search_destination
  - action: action_search_travel

- story: search travel with form
  steps:
  - user: |
      tôi muốn đi du lịch
    intent: search_travel
  - action: travel_form
  - active_loop: travel_form
  - user: |
      Đà Lạt
    intent: inform
  - action: travel_form
  - active_loop: travel_form
  - user: |
      5 triệu
    intent: inform
  - action: travel_form
  - active_loop: null
  - action: action_search_travel

- story: ask about tour info then thanks
  steps:
  - user: |
      tìm tour đi Phú Quốc 3 ngày 2 đêm
    intent: ask_tour_info
  - action: action_search_tour
  - user: |
      cảm ơn bạn nhiều
    intent: thanks
  - action: utter_suggest_more

- story: search accommodation then change mind
  steps:
  - user: |
      tìm khách sạn ở Vũng Tàu
    intent: search_accommodation
  - action: action_search_tour_info
  - user: |
      đổi sang homestay nhé
    intent: inform
  - action: action_search_tour_info

- story: out of scope then correct question
  steps:
  - user: |
      giá vàng hôm nay bao nhiêu
    intent: out_of_scope
  - action: utter_out_of_scope
  - user: |
      cho tôi hỏi thăm quan ở Hội An
    intent: ask_location_feature
  - action: action_ai_consultant

- story: say goodbye
  steps:
  - user: |
      tạm biệt
    intent: goodbye
  - action: utter_goodbye

- story: bot challenge
  steps:
  - user: |
      bạn là ai
    intent: bot_challenge
  - action: utter_iamabot

# This file contains the different endpoints your bot can use.
# Auto-generated by scripts/generate_endpoints.py
#
# Deploy strategy: Option A — model is baked into Docker image at build time.
# Rasa loads model from /app/rasa_bot/models/ (no model server needed at runtime).

# Server which runs your custom actions.
# https://rasa.com/docs/rasa/custom-actions

action_endpoint:
  url: "__RASA_ACTION_URL__"

# Tracker store — PostgreSQL for conversation history.
# https://rasa.com/docs/rasa/tracker-stores

tracker_store:
  type: SQL
  dialect: postgresql
  url: "__DB_HOST__"
  db: "__DB_NAME__"
  port: __DB_PORT__
  username: "__DB_USER__"
  password: "__DB_PASSWORD__"


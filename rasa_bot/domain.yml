#data/domain.yml
version: "3.1"

intents:
  - affirm
  - deny
  - thanks
  # - test_s3

  - bot_challenge
  - search_travel
  - search_destination
  - search_activity
  - search_accommodation
  - search_price
  - search_food_dining
  - ask_itinerary
  - ask_transportation
  - ask_policy_booking
  - ask_tour_info
  - greet
  - goodbye
  - ask_weather_timing

  - ask_location_feature
  - book_tour
  - inform
  - out_of_scope
  - reset_slots

entities:
  - season
  - month
  - month_from
  - month_to
  - time_window

  - departure # Điểm khởi hành
  - destination # Điểm đến (Thay cho location cũ)
  - time # Thời gian
  - activity # Hoạt động
  - budget # Ngân sách
  - duration # Thời lượng
  - party_size # Số lượng người
  - tour_name # Tên tour cụ thể
  - category # Phân biệt ks, biển, nhà hàng
  - transportation # Phương tiện di chuyển

forms:
  travel_form:
    required_slots:
      - destination
      - budget

slots:
  season:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: season

  month:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: month

  month_from:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: month_from

  month_to:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: month_to

  budget:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget
        extractor: RegexEntityExtractor

  time_window:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: time_window

  destination:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: destination
        extractor: DIETClassifier

  category:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: category
        extractor: DIETClassifier

  departure:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: departure

  time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: time

  party_size:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: party_size

  tour_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tour_name

  duration:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: duration

  confirmation:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

actions:
  #- action_search_destination
  - action_log_start
  - validate_travel_form
  - action_search_travel
  - action_search_tour
  - action_search_activity
  - action_ai_consultant
  - action_search_tour_info
  - action_reset_slots

responses:
  utter_cancel_form:
    - text: "Oki chốt! Khi nào cần vi vu hay set kèo cứ gọi bot nha, mãi iu! ✌️"
    - text: "Đã hủy form tìm tour nè. Bạn cứ ngâm cứu thêm nhe! 😍"

  utter_greet:
    - text: "Chào bạn! Mình là trợ lý du lịch, sẵn sàng tư vấn cho bạn. Bạn có thể thử hỏi:\n  • 'gợi ý điểm du lịch'\n  • 'tìm tour đi Đà Lạt'\n  • 'khách sạn ở Vũng Tàu'\n  • 'ăn gì ở Hội An'"

  utter_cheer_up:
    - text: "Đừng lo nhé, mình gợi ý vài điểm đến phù hợp để bạn tham khảo ngay."

  utter_did_that_help:
    - text: "Những gợi ý này có phù hợp với bạn không?"
    - text: "Bạn thấy ổn không? Cần mình hỗ trợ thêm gì nữa không?"

  utter_happy:
    - text: "Tuyệt vời! Bạn muốn mình lọc tiếp theo tháng, ngân sách hay hoạt động?"

  # utter_test_s3:
  #   - text: "Báo cáo sếp Thịnh, em đang chạy bằng não tải từ S3 về đây ạ!"

  utter_thanks:
    - text: "Có gì đâu bạn! Nếu cần hỏi thêm gì cứ nhắn mình nhé! 😊"
    - text: "Không có gì ạ! Chúc bạn có chuyến đi chơi thật vui nha! 🌟"
    - text: "Sẵn sàng giúp bạn mà! Bạn còn muốn tìm hiểu thêm gì nữa không?"

  utter_suggest_more:
    - text: "Bạn còn muốn tìm hiểu thêm thông tin gì khác không? Mình có thể tư vấn thêm về ẩm thực, chỗ ở hay phương tiện di chuyển nha!"
    - text: "Ngoài ra bạn có muốn mình gợi ý thêm chỗ ở hoặc món ngon ở đó không?"
    - text: "Bạn cần mình hỗ trợ thêm gì nữa không (ví dụ: tìm khách sạn, hỏi về ẩm thực,...)?"

  utter_confirm_search:
    - text: "Ok để mình check lại nhé: bạn muốn tìm tour đi **{destination}** với ngân sách **{budget}** phải không?"
    - text: "Mình xác nhận lại nha: bạn muốn đi **{destination}**, budget **{budget}**, đúng không nào?"

  utter_cancel_search:
    - text: "Ok không sao! Bạn muốn đổi thông tin gì? Mình hỏi lại từ đầu nha!"
    - text: "Rảnh rang mà, bạn chỉnh lại thông tin rồi mình tìm lại cho nha! 😊"

  utter_goodbye:
    - text: "Cảm ơn bạn đã sử dụng trợ lý du lịch. Hẹn gặp lại bạn nhé!"
    - text: "Tạm biệt bạn! Khi nào cần tư vấn du lịch cứ gọi mình nha! ✌️"

  utter_iamabot:
    - text: "Mình là chatbot tư vấn du lịch, luôn sẵn sàng gợi ý điểm đến phù hợp cho bạn."

  utter_out_of_scope:
    - text: "Mình chỉ chuyên tư vấn du lịch thôi bạn ơi! Bạn thử hỏi mình về địa điểm, tour, khách sạn hoặc ẩm thực xem sao nhé! 😊"
    - text: "Chuyện đó ngoài vùng du lịch của mình rồi. Bạn muốn gợi ý điểm đến hay tìm tour thì mình sẵn sàng nha!"

  utter_ask_destination:
    - text: "Chuyến đi này bạn dự định ghé thăm tỉnh thành hay địa điểm cụ thể nào?"
    - text: "Tuyệt vời! Bạn đã chọn được điểm đến nào chưa (ví dụ: Sapa, Đà Lạt, vùng biển...)?"

  utter_ask_budget:
    - text: "Để mình lọc tour chuẩn nhất, ngân sách dự kiến của bạn khoảng bao nhiêu (ví dụ: dưới 5 triệu, 3 củ...)?"
    - text: "Tài chính cho chuyến đi này của bạn rơi vào khoảng bao nhiêu tiền?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

version: "3.1"

rules:
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Say 'I am a bot' anytime the user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: out of scope fallback
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: Trả lời về tính năng, dịch vụ của địa điểm
    steps:
      - intent: ask_location_feature
      - action: action_ai_consultant

  - rule: Tìm kiếm chỗ ở khách sạn
    steps:
      - intent: search_accommodation
      - action: action_search_tour_info

  - rule: Phản hồi khi khách hỏi ẩm thực
    steps:
      - intent: search_food_dining
      - action: action_ai_consultant

  - rule: Tư vấn phương tiện đi lại
    steps:
      - intent: ask_transportation
      - action: action_ai_consultant

  - rule: Giải đáp chính sách tour / booking
    steps:
      - intent: ask_policy_booking
      - action: action_ai_consultant

  - rule: Gợi ý lịch trình tự túc
    steps:
      - intent: ask_itinerary
      - action: action_ai_consultant

  - rule: Xử lý tìm kiếm hoạt động
    steps:
      - intent: search_activity
      - action: action_search_activity

  - rule: Xử lý tìm kiếm điểm đến
    steps:
      - intent: search_destination
      - action: action_search_travel

  - rule: Xử lý tìm kiếm giá tour / ngân sách
    steps:
      - intent: search_price
      - action: action_search_travel

  - rule: Tư vấn chi tiết một tour cụ thể
    steps:
      - intent: ask_tour_info
      - action: action_search_tour

  - rule: Tư vấn về thời tiết / mùa
    steps:
      - intent: ask_weather_timing
      - action: action_ai_consultant

  - rule: Reset toàn bộ slots để test
    steps:
      - intent: reset_slots
      - action: action_reset_slots

  - rule: Hủy form khi khách đổi ý (Gen Z quay xe)
    condition:
      - active_loop: travel_form
    steps:
      - intent: deny
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_cancel_form
      - action: action_reset_slots

  - rule: Hủy form mượt khi vẫy tay chào
    condition:
      - active_loop: travel_form
    steps:
      - intent: goodbye
      - action: action_deactivate_loop
      - active_loop: null
      - action: utter_cancel_form
      - action: action_reset_slots

  - rule: 1. Kích hoạt Form khi khách muốn tìm tour
    steps:
      - intent: search_travel
      - action: travel_form
      - active_loop: travel_form

  - rule: 2. Xử lý sau khi Form thu thập đủ thông tin
    condition:
      - active_loop: travel_form
    steps:
      - action: travel_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_travel

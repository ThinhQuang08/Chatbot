# The config recipe.
recipe: default.v1

assistant_id: 20260307-161607-chamfered-proof

language: vi

pipeline:
  - name: rasa_bot.components.pyvi_tokenizer.PyViTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 5
  
  - name: rasa_bot.components.vietnamese_sbert_featurizer.VietnameseSBertFeaturizer
    model_name: bkai-foundation-models/vietnamese-bi-encoder
  
  - name: DIETClassifier
    epochs: 300
    learning_rate: 0.001
    hidden_layers_sizes:
      text: [256, 128]
    batch_strategy: balanced
    constrain_similarities: true
    scale_loss: true
    dense_dimension:
      text: 256
    num_transformer_layers: 3
    num_heads: 8
    random_seed: 42
  
  - name: RegexEntityExtractor
    use_lookup_tables: true
    use_regexes: true
    use_word_boundaries: false
  
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.6
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 150         # Tăng chút sức mạnh cho bộ điều hướng hội thoại
    constrain_similarities: true
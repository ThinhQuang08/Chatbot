version: '3.8'

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Qdrant (Vector DB) ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── MinIO (Object Storage) ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: chatbot_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MLflow (Experiment Tracking) ─────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: chatbot_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      --default-artifact-root s3://${MINIO_BUCKET}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── RabbitMQ (Message Broker) ────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chatbot_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"         # AMQP
      - "${RABBITMQ_MGM_PORT}:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ─── Jenkins (CI/CD) ──────────────────────────────────────────────────────
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins_bot_du_lich
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Admin Dashboard ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      MINIO_URL: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RABBITMQ_HOST: rabbitmq
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  rabbitmq_data:
  jenkins_data: